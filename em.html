<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EM시스템 - 에스지라이뮤</title>
    <meta name="description" content="EM시스템 도서관용품, 도서관물품">
    <link rel="stylesheet" href="style.css?v=7">
    <link rel="stylesheet" href="auth.css">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="cart.css">
    <link rel="stylesheet" href="inquiry.css">
    <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.0/kakao.min.js" integrity="sha384-l+xbElFSnPZ2rOaPrU//2Kes5Q39MW1SI6zWzwA88yCfL9Mi9SbpS7cwjLxS7fJ6" crossorigin="anonymous"></script>
    <script src="https://static.nid.naver.com/js/naveridlogin_js_sdk_2.0.2.js" charset="utf-8"></script>
    <style>
        .category-page {
            padding: 120px 0 100px;
            min-height: 800px;
        }
        .category-header {
            text-align: center;
            margin-bottom: 60px;
            padding: 80px 5%;
            background-color: var(--color-surface);
        }
        .category-title {
            font-size: 2.5rem;
            color: var(--color-text);
            font-weight: 700;
            margin-bottom: 20px;
        }
        .subcategory-nav {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 50px;
            flex-wrap: wrap;
            list-style: none;
        }
        .subcategory-item {
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--color-text-light);
            background: #fff;
            border: 1px solid var(--color-border);
            border-radius: 30px;
            cursor: pointer;
            transition: var(--transition-smooth);
        }
        .subcategory-item.active {
            color: #fff;
            background: var(--color-primary);
            border-color: var(--color-primary);
        }
        .product-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }
        .sub-content {
            display: none;
            animation: fadeIn 0.5s ease;
        }
        .sub-content.active {
            display: block;
        }
        .category-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 40px;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-container">
            <button class="mobile-menu-toggle" id="mobileMenuToggle">
                <i class="fa-solid fa-bars"></i>
            </button>
            <h1 class="logo"><a href="index.html">SG LIMU</a></h1>
            <nav class="gnb" id="mainGnb">
                <ul>
                    <!-- script.js에서 동적 생성 -->
                </ul>
            </nav>
            <div class="header-utils">
                <div class="search-wrapper">
                    <input type="text" class="search-input" placeholder="검색어를 입력하세요">
                    <button class="search-btn" id="headerSearchBtn"><i class="fa-solid fa-magnifying-glass"></i></button>
                </div>
                <a href="cart.html" title="장바구니"><i class="fa-solid fa-cart-shopping"></i></a>
                <div id="userAuthWrap">
                    <!-- auth.js에서 동적 생성 -->
                </div>
            </div>
        </div>
    </header>

    <main class="category-page">
        <div class="category-header">
            <h2 class="category-title">EM시스템</h2>
            <p>가장 현실적인 도서 분실 방지 시스템입니다.</p>
        </div>

        <div class="category-container">
            <ul class="subcategory-nav" id="subCategoryNav">
                <!-- script.js에서 동적 생성 -->
            </ul>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-container">
            <div class="footer-info">
                <p><strong>(주)에스지라이뮤</strong> &nbsp;|&nbsp; Tel : 1544-5703 &nbsp;|&nbsp; Fax : 051-518-5985 &nbsp;|&nbsp; E-Mail : limu101@nate.com</p>
                <p class="copyright">Copyright(c) 2023 SG LIMU. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <aside class="right-fixed-banner">
        <ul class="banner-menu">
            <li><a href="#" class="banner-btn recent-btn-aside" title="최근 본 상품"><i class="fa-solid fa-clock-rotate-left"></i><span class="tooltip">최근본상품</span></a></li>
            <li><a href="#" class="banner-btn cart-btn-aside" title="장바구니"><i class="fa-solid fa-cart-shopping"></i><span class="tooltip">장바구니</span></a></li>
            <li><a href="#" class="banner-btn naver-talk" title="네이버톡톡"><i class="fa-solid fa-comment-dots"></i><span class="tooltip">네이버톡톡</span></a></li>
            <li class="scroll-btns">
                <button class="banner-btn scroll-top" id="scrollTopBtn" title="위로"><i class="fa-solid fa-chevron-up"></i></button>
                <button class="banner-btn scroll-bottom" id="scrollBottomBtn" title="아래로"><i class="fa-solid fa-chevron-down"></i></button>
            </li>
        </ul>
    </aside>

    <div class="chat-window" id="chatWindow">
        <div class="chat-header">
            <h4>실시간 문의</h4>
            <button class="chat-close" id="chatCloseBtn">&times;</button>
        </div>
        <div class="chat-body" id="chatBody">
            <div class="message system-msg">안녕하세요! 무엇을 도와드릴까요?</div>
        </div>
        <div class="chat-footer">
            <input type="text" id="chatInput" placeholder="메시지를 입력하세요...">
            <button id="chatSendBtn"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        window.CURRENT_PAGE_ID = 'em';
    </script>
    <script type="module" src="script.js"></script>
    <script type="module" src="auth.js"></script>
</body>
</html>
