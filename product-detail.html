    <script>
        // UI Logic
        function changeImage(src, element) {
            document.getElementById('mainImage').src = src;
            document.querySelectorAll('.thumb-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
        }

        function updateQty(change) {
            const input = document.getElementById('qtyInput');
            let current = parseInt(input.value);
            let newVal = current + change;
            if (newVal < 1) newVal = 1;
            input.value = newVal;
            
            calculateTotal();
        }

        function calculateTotal() {
            let optPrice = 0;
            const colorSelect = document.getElementById('colorOption');
            // Basic logic for hardcoded colors if needed, but usually from DB
            
            const sizeSelect = document.getElementById('sizeOption');
            if(sizeSelect && sizeSelect.value) {
                const parts = sizeSelect.value.split('|');
                optPrice += parseInt(parts[0]) || 0;
            }
            
            const qty = parseInt(document.getElementById('qtyInput').value);
            const total = (window.basePrice || 0 + optPrice) * qty;
            const totalPriceElem = document.getElementById('totalPrice');
            if (totalPriceElem) totalPriceElem.innerText = total.toLocaleString();
        }

        document.getElementById('colorOption')?.addEventListener('change', calculateTotal);
        document.getElementById('sizeOption')?.addEventListener('change', calculateTotal);

        function switchTab(index, element) {
            document.querySelectorAll('.detail-tab-btn').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.detail-tab-content').forEach(el => el.classList.remove('active'));
            
            element.classList.add('active');
            document.getElementById('tab' + index).classList.add('active');
        }
    </script>

    <script type="module">
        import { supabase } from './supabase-client.js';

        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');

        async function initProductDetail() {
            if(!productId) {
                console.warn("Product ID missing in URL.");
                return;
            }

            const { data: product, error } = await supabase
                .from('products')
                .select('*')
                .eq('id', productId)
                .single();

            if (error || !product) {
                console.error("Product fetch error:", error);
                return;
            }

            // Update Basic Info
            document.title = product.name + " - ?먯뒪吏?쇱씠裕?;
            document.querySelector('.product-title').innerText = product.name;
            const priceElem = document.querySelector('.product-price');
            if (product.price === '?꾪솕臾몄쓽' || !product.price) {
                priceElem.innerHTML = '?꾪솕臾몄쓽';
                window.basePrice = 0;
            } else {
                priceElem.innerHTML = Number(product.price).toLocaleString() + '<span>??/span>';
                window.basePrice = Number(product.price);
            }
            
            document.getElementById('breadcrumbCurrent').innerText = product.name;

            // Main Image & Thumbnails
            const mainImgElem = document.getElementById('mainImage');
            if(product.image_url && mainImgElem) {
                mainImgElem.src = product.image_url;
                const thumbList = document.querySelector('.thumbnail-list');
                if(thumbList) {
                    thumbList.innerHTML = `
                        <div class="thumb-item active" onclick="changeImage('${product.image_url}', this)">
                            <img src="${product.image_url}" alt="硫붿씤 ?대?吏">
                        </div>
                    `;
                }
            }
            
            // Options Logic
            const colorOption = document.getElementById('colorOption');
            if(colorOption) {
                let colorList = [];
                if(product.colors) {
                    colorList = product.colors.split(',').map(c => c.trim());
                } else if(product.description) {
                    const match = product.description.match(/\[\[C:(.*?)\]\]/);
                    if(match && match[1]) colorList = match[1].split(',').map(c => c.trim());
                }

                if(colorList.length > 0) {
                    colorOption.innerHTML = '<option value="">?됱긽???좏깮?섏꽭??/option>';
                    colorList.forEach(c => {
                        const opt = document.createElement('option');
                        opt.value = c; opt.innerText = c;
                        colorOption.appendChild(opt);
                    });
                    document.getElementById('colorOptionGroup').style.display = 'block';
                } else {
                    document.getElementById('colorOptionGroup').style.display = 'none';
                }
            }

            const sizeOption = document.getElementById('sizeOption');
            if(sizeOption) {
                let sizeList = [];
                if(product.sizes) {
                    sizeList = product.sizes.split(',').map(s => s.trim());
                } else if(product.description) {
                    const match = product.description.match(/\[\[S:(.*?)\]\]/);
                    if(match && match[1]) sizeList = match[1].split(',').map(s => s.trim());
                }

                if(sizeList.length > 0) {
                    sizeOption.innerHTML = '<option value="0|">?ъ씠利덈? ?좏깮?섏꽭??/option>';
                    sizeList.forEach(s => {
                        const parts = s.split(':');
                        const name = parts[0];
                        const price = parseInt(parts[1]) || 0;
                        const opt = document.createElement('option');
                        opt.value = `${price}|${name}`;
                        opt.innerText = price > 0 ? `${name} (+${price.toLocaleString()}??` : name;
                        sizeOption.appendChild(opt);
                    });
                    document.getElementById('sizeOptionGroup').style.display = 'block';
                } else {
                    document.getElementById('sizeOptionGroup').style.display = 'none';
                }
            }

            // Description
            const descElem = document.getElementById('dynamicDesc');
            if(descElem && product.description) {
                let cleanDesc = product.description.replace(/\[\[C:.*?\]\]/g, '').replace(/\[\[S:.*?\]\]/g, '').trim();
                descElem.innerHTML = cleanDesc.replace(/\n/g, '<br>').trim();
            }

            // Page Data from site_configs
            const { data: configData } = await supabase.from('site_configs').select('value').eq('key', 'pageData_' + productId).single();
            const data = configData ? configData.value : null;
            
            if(data) {
                // Additional Main Images
                if(data.mainImages && data.mainImages.length > 0) {
                    const thumbList = document.querySelector('.thumbnail-list');
                    if(thumbList) {
                        data.mainImages.forEach((src, idx) => {
                            if(src === product.image_url) return;
                            thumbList.innerHTML += `
                                <div class="thumb-item" onclick="changeImage('${src}', this)">
                                    <img src="${src}" alt="?쒗뭹 ?대?吏 ${idx+1}">
                                </div>
                            `;
                        });
                    }
                }
                
                // Detail Images
                const detailContainer = document.getElementById('detailImagesContainer');
                if(detailContainer && (data.detailImages || data.detailImage)) {
                    detailContainer.innerHTML = '';
                    const imgs = data.detailImages || [data.detailImage];
                    imgs.forEach(src => {
                        if(!src) return;
                        const img = document.createElement('img');
                        img.src = src;
                        img.style.cssText = "max-width:100%; display:block; margin: 0 auto 10px auto;";
                        detailContainer.appendChild(img);
                    });
                }
                
                // Specs
                const specTable = document.getElementById('dynamicSpecTable');
                if(specTable && data.specs && data.specs.length > 0) {
                    specTable.innerHTML = '';
                    data.specs.forEach(s => {
                        specTable.innerHTML += `<tr><th style="padding:15px; text-align:left; background:#f9f9f9; width:25%; border:1px solid #ddd;">${s.key}</th><td style="padding:15px; border:1px solid #ddd;">${s.val}</td></tr>`;
                    });
                }
                
                // Features
                const featureContainer = document.getElementById('dynamicFeatures');
                if(featureContainer && data.features && data.features.length > 0) {
                    featureContainer.innerHTML = '';
                    data.features.forEach((feat, i) => {
                        const num = (i + 1).toString().padStart(2, '0');
                        featureContainer.innerHTML += `
                            <div class="feature-item" style="margin-bottom:20px; border-bottom:1px dashed #eee; padding-bottom:15px;">
                                <h5 style="font-size:1.1rem; color:#222; margin-bottom:8px; display:flex; align-items:center;">
                                    <span style="display:inline-block; background:var(--color-primary); color:#fff; width:22px; height:22px; line-height:22px; text-align:center; border-radius:50%; margin-right:10px; font-size:0.75rem;">${num}</span>
                                    ${feat.title}
                                </h5>
                                <p style="color:#666; line-height:1.6; padding-left:32px;">${feat.desc.replace(/\n/g, '<br>')}</p>
                            </div>
                        `;
                    });
                }
            }
            
            calculateTotal();
        }

        window.addEventListener('DOMContentLoaded', initProductDetail);
    </script>
