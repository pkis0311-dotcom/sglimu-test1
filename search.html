    <script type="module">
        import { supabase } from './supabase-client.js';

        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const query = urlParams.get('q');
            const resultCountElem = document.getElementById('resultCount');
            const resultsContainer = document.getElementById('searchResults');
            const noResultsElem = document.getElementById('noResults');

            if (!query || query.trim() === '') {
                resultCountElem.innerText = 'Í≤Ä?âÏñ¥Î•??ÖÎ†•?¥Ï£º?∏Ïöî.';
                noResultsElem.style.display = 'block';
                return;
            }

            resultCountElem.innerHTML = `<span class="search-query">"${query}"</span> ???Ä??Í≤Ä??Í≤∞Í≥º?ÖÎãà??`;

            try {
                const { data: products, error } = await supabase
                    .from('products')
                    .select('*')
                    .or(`name.ilike.%${query}%,description.ilike.%${query}%`)
                    .order('created_at', { ascending: false });

                if (error) throw error;

                if (!products || products.length === 0) {
                    noResultsElem.style.display = 'block';
                    resultCountElem.innerHTML = `<span class="search-query">"${query}"</span> ???Ä??Í≤∞Í≥ºÍ∞Ä ?ÜÏäµ?àÎã§.`;
                } else {
                    resultCountElem.innerHTML = `<span class="search-query">"${query}"</span> ???Ä??Ï¥?<strong>${products.length}</strong>Í∞úÏùò ?ÅÌíà??Í≤Ä?âÎêò?àÏäµ?àÎã§.`;
                    
                    products.forEach(p => {
                        const card = document.createElement('div');
                        card.className = 'product-card visible';
                        card.style.cursor = 'pointer';
                        card.onclick = () => window.location.href = 'product-detail.html?id=' + p.id;
                        
                        const priceStr = (!p.price || p.price === '?ÑÌôîÎ¨∏Ïùò') ? '?ÑÌôîÎ¨∏Ïùò' : Number(p.price).toLocaleString() + '??;
                        
                        card.innerHTML = `
                            <div class="product-img" style="background-image: url('${p.image_url || 'assets/no-image.png'}'); background-size: contain; background-repeat:no-repeat; background-position: center; border-bottom: 1px solid #eee; height: 250px;"></div>
                            <div class="product-info" style="text-align:center; padding:15px;">
                                <h4 style="margin-bottom:8px; font-size:1.1rem;">${p.name}</h4>
                                <p style="color:var(--color-primary); font-weight:bold;">${priceStr}</p>
                            </div>
                        `;
                        resultsContainer.appendChild(card);
                    });
                }
            } catch (err) {
                console.error('Search error:', err);
                resultCountElem.innerText = 'Í≤Ä??Ï§??§Î•òÍ∞Ä Î∞úÏÉù?àÏäµ?àÎã§.';
            }
        });
    </script>
