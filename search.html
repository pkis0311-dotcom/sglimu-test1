    <script type="module">
        import { supabase } from './supabase-client.js';

        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const query = urlParams.get('q');
            const resultCountElem = document.getElementById('resultCount');
            const resultsContainer = document.getElementById('searchResults');
            const noResultsElem = document.getElementById('noResults');

            if (!query || query.trim() === '') {
                resultCountElem.innerText = '寃?됱뼱瑜??낅젰??二쇱꽭??';
                noResultsElem.style.display = 'block';
                return;
            }

            resultCountElem.innerHTML = `<span class="search-query">"${query}"</span> ?????寃??寃곌낵?낅땲??`;

            try {
                const { data: products, error } = await supabase
                    .from('products')
                    .select('*')
                    .or(`name.ilike.%${query}%,description.ilike.%${query}%`)
                    .order('created_at', { ascending: false });

                if (error) throw error;

                if (!products || products.length === 0) {
                    noResultsElem.style.display = 'block';
                    resultCountElem.innerHTML = `<span class="search-query">"${query}"</span> ?????寃곌낵媛 ?놁뒿?덈떎.`;
                } else {
                    resultCountElem.innerHTML = `<span class="search-query">"${query}"</span> ?????珥?<strong>${products.length}</strong>媛쒖쓽 ?곹뭹??寃?됰릺?덉뒿?덈떎.`;
                    
                    // Fetch site_configs for page data (mainImages)
                    let configMap = {};
                    try {
                        const productIds = products.map(p => p.id);
                        const { data: configs } = await supabase.from('site_configs').select('key, value').in('key', productIds.map(id => 'pageData_' + id));
                        if (configs) {
                            configs.forEach(c => {
                                configMap[c.key] = c.value;
                            });
                        }
                    } catch (err) {
                        console.error("Error loading site configs for searched products", err);
                    }

                    products.forEach(p => {
                        const card = document.createElement('div');
                        card.className = 'product-card visible';
                        card.style.cursor = 'pointer';
                        card.onclick = () => window.location.href = 'product-detail.html?id=' + p.id;
                        
                        const pData = configMap['pageData_' + p.id];
                        const displayImg = (pData && pData.mainImages && pData.mainImages.length > 0) ? pData.mainImages[0] : 'assets/no-image.png';

                        const priceStr = (!p.price || p.price === '?꾪솕臾몄쓽') ? '?꾪솕臾몄쓽' : Number(p.price).toLocaleString() + '??;
                        
                        card.innerHTML = `
                            <div class="product-img" style="background-image: url('${displayImg}'); background-size: cover; background-repeat:no-repeat; background-position: center; border-bottom: 1px solid #eee; height: 250px;"></div>
                            <div class="product-info" style="text-align:center; padding:15px;">
                                <h4 style="margin-bottom:8px; font-size:1.1rem;">${p.name}</h4>
                                <p style="color:var(--color-primary); font-weight:bold;">${priceStr}</p>
                            </div>
                        `;
                        resultsContainer.appendChild(card);
                    });
                }
            } catch (err) {
                console.error('Search error:', err);
                resultCountElem.innerText = '寃??以??ㅻ쪟媛 諛쒖깮?덉뒿?덈떎.';
            }
        });
