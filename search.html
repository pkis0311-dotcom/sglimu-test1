    <script type="module">
        import { supabase } from './supabase-client.js';

        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const query = urlParams.get('q');
            const resultCountElem = document.getElementById('resultCount');
            const resultsContainer = document.getElementById('searchResults');
            const noResultsElem = document.getElementById('noResults');

            if (!query || query.trim() === '') {

                return;
            }

            resultCountElem.innerHTML = `<span class="search-query">"${query}"</span> ?????寃??寃곌낵?낅땲??`;

            try {
                const { data: products, error } = await supabase
                    .from('products')
                    .select('*')
                    .or(`name.ilike.%${query}%,description.ilike.%${query}%`)
                    .order('created_at', { ascending: false });

                if (error) throw error;

                if (!products || products.length === 0) {
                    noResultsElem.style.display = 'block';
                    resultCountElem.innerHTML = `<span class="search-query">"${query}"</span> ?????寃곌낵媛 ?놁뒿?덈떎.`;

                        const priceStr = (!p.price || p.price === '?꾪솕臾몄쓽') ? '?꾪솕臾몄쓽' : Number(p.price).toLocaleString() + '??;
