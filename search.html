    <script type="module">
        import { supabase } from './supabase-client.js';

        const urlParams = new URLSearchParams(window.location.search);
        const query = urlParams.get('q');
        const displayQueryElem = document.getElementById('displayQuery');
        const resultCountElem = document.getElementById('resultCount');
        const resultsGrid = document.getElementById('searchResultsGrid');
        const loadingState = document.getElementById('loadingState');

        async function initSearch() {
            if (!query) {
                displayQueryElem.innerText = "?꾩껜 ?곹뭹";
                loadingState.innerHTML = '<i class="fa-solid fa-magnifying-glass"></i><p>寃?됱뼱瑜??낅젰??二쇱꽭??</p>';
                return;
            }

            displayQueryElem.innerText = query;

            try {
                // Search in name or description
                const { data: products, error } = await supabase
                    .from('products')
                    .select('*')
                    .or(`name.ilike.%${query}%,description.ilike.%${query}%`)
                    .order('created_at', { ascending: false });

                if (error) throw error;

                loadingState.style.display = 'none';
                resultCountElem.innerText = products.length;

                if (products.length === 0) {
                    resultsGrid.innerHTML = `
                        <div class="empty-results">
                            <i class="fa-regular fa-face-frown"></i>
                            <p>'${query}'?????寃??寃곌낵媛 ?놁뒿?덈떎.</p>

                        </div>
                    `;
                    return;

                products.forEach(p => {
                    const card = document.createElement('div');
                    card.className = 'product-card visible';
                    card.style.cursor = 'pointer';

                    const priceStr = (!p.price || p.price === '?꾪솕臾몄쓽') ? '?꾪솕臾몄쓽' : Number(p.price).toLocaleString() + '??;
                    
                    card.innerHTML = `

                        <div class="product-info" style="padding:20px; text-align:center;">

                });

            } catch (err) {
