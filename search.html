        import { supabase } from './supabase-client.js';

        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const query = urlParams.get('q');
            const resultCountElem = document.getElementById('resultCount');
            const resultsContainer = document.getElementById('searchResults');
            const noResultsElem = document.getElementById('noResults');

            if (!query || query.trim() === '') {
                resultCountElem.innerText = '검?�어�??�력?�주?�요.';

            resultCountElem.innerHTML = `<span class="search-query">"${query}"</span> ???�??검??결과?�니??`;

            try {
                const { data: products, error } = await supabase
                    .from('products')
                    .select('*')
                    .or(`name.ilike.%${query}%,description.ilike.%${query}%`)
                    .order('created_at', { ascending: false });

                if (error) throw error;

                if (!products || products.length === 0) {
                    noResultsElem.style.display = 'block';
                    resultCountElem.innerHTML = `<span class="search-query">"${query}"</span> ???�??결과가 ?�습?�다.`;
